server.port=${PORT:8080}

spring.datasource.url=jdbc:h2:file:./data/ipo-tracker
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=${H2_CONSOLE_ENABLED:false}

# Remove H2_CONSOLE_ENABLED from Render again afterward and let it redeploy,
# since leaving web-allow-others=true live is a real security exposure
# (anyone with your Render URL could otherwise browse/edit your DB) ?
# this is more important to revert than the plain enabled flag alone.

ipo.tracker.category=mainboard

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.chat.id=${TELEGRAM_CHAT_ID}
alert.threshold.total=5.0